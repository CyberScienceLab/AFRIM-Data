- id: T0104
  name: Evidence Source Inventory
  phase: P01
  sub_of: null
  evidence_classes:
  - EC01
  - EC02
  - EC03
  - EC04
  - EC05
  - EC06
  - EC07
  access_capability: []
  maturity:
    base: Proposed
    qualification: null
  readiness_measures:
  - id: R0009
    relationship: strengthening
  notes: Graded Proposed under the safer-grade rule — although the classical identification activity
    it descends from (NIST SP 800-86) is well established, this AI-specific extension has not yet been
    independently validated at that level.
  status: active
  absence_state_vocabulary:
  - confirmed_nonexistent
  - not_configured
  - expired
  - not_retained
  - inaccessible
  - not_produced
  - not_searched
  - unknown
  description: 'Evidence Source Inventory is the systematic enumeration, begun at engagement and iterated
    throughout, of what evidence exists for an AI incident, where it lives, who controls it, how long
    it will survive, and what does not exist. For each of FIRAI''s seven evidence classes, the examiner
    records presence or absence, location and custodian, retention windows, and access constraints per
    component. It descends from the classical identification activity in NIST SP 800-86, but is harder
    in AI systems: evidence existence is not guaranteed by default, and evidence is distributed across
    components with different owners under different retention policies and legal postures.'
  claim_profile:
    does_establish:
    - Presence, absence, location, custodian, and retention window of evidence per class and component,
      as documented at inventory time
    does_not_establish:
    - That a component reported as evidence-absent is genuinely nonexistent rather than merely not produced
    alternative_propositions:
    - Absence may reflect the component not being configured, expiry, non-retention, inaccessibility,
      non-production, an incomplete search, or confirmed nonexistence — these are distinct states, not
      synonyms
    corroboration_requirements:
    - Custodian representations documented verbatim so later contradictions are provable
    quality_controls:
    - Timestamp the inventory
    - Initiate authorized preservation immediately through the engagement's legal/organizational process
    stop_conditions:
    - Do not report provider non-production of evidence as confirmed nonexistence
  references:
  - text: 'Kent, Chevalier, Grance, Dang (2006) — NIST SP 800-86: Guide to Integrating Forensic Techniques
      into Incident Response'
    status: active
  - text: 'Brezinski, Killalea (2002) — RFC 3227 (BCP 55): Guidelines for Evidence Collection and Archiving'
    status: active
  - text: 'International Organization for Standardization & IEC (2012) — ISO/IEC 27037:2012: Information
      technology — Security techniques — Guidelines for identification, collection, acquisition and preservation
      of digital evidence'
    status: active
  - text: European Parliament & Council of the European Union (2024) — Regulation (EU) 2024/1689 (Artificial
      Intelligence Act), Articles 12 and 19
    status: active
- id: T0104.001
  name: AI Artifact Volatility Ordering
  phase: P01
  sub_of: T0104
  evidence_classes:
  - EC01
  - EC02
  - EC03
  - EC04
  - EC05
  - EC06
  - EC07
  access_capability: []
  maturity:
    base: Proposed
    qualification: null
  readiness_measures:
  - id: R0009
    relationship: strengthening
  notes: 'Sequences acquisition by state-decay rate: the EC01→EC07 row ordering is normative here,
    extending classical power-loss volatility (RFC 3227) with silent-mutation volatility — artifacts
    that persist but whose as-at-incident state decays while the system stays up (e.g. a drifting vector
    index, or a provider silently updating the model behind an unchanged public name). The ordering is
    a default, not a dogma: documented component-level facts (e.g. a contractually pinned model version)
    can override it case-by-case.'
  status: active
  references:
  - text: 'Brezinski, Killalea (2002) — RFC 3227 (BCP 55): Guidelines for Evidence Collection and Archiving'
    status: active
  - text: 'Dehghantanha, Homayoun — AI Forensics Across White-, Grey-, and Black-Box Access: A Process
      Model and Research Agenda for Post-Incident Investigation of AI Systems'
    status: active
