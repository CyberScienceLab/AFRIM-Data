- id: T0104
  name: Evidence Source Inventory
  phase: P01
  sub_of: null
  evidence_classes:
  - EC01
  - EC02
  - EC03
  - EC04
  - EC05
  - EC06
  - EC07
  access_capability: []
  maturity:
    base: Proposed
    qualification: null
  readiness_measures:
  - id: R0009
    relationship: strengthening
  notes: safer-grade; classical ancestry Established
  status: active
  description: 'Evidence Source Inventory is the systematic enumeration, begun at engagement and iterated
    throughout, of what evidence exists for an AI incident, where it lives, who controls it, how long
    it will survive, and what does not exist. For each of FIRAI''s seven evidence classes, the examiner
    records presence or absence, location and custodian, retention windows, and access constraints per
    component. It descends from the classical identification activity in NIST SP 800-86, but is harder
    in AI systems: evidence existence is not guaranteed by default, and evidence is distributed across
    components with different owners under different retention policies and legal postures.'
  claim_profile:
    does_establish:
    - presence, absence, location, custodian, and retention window of evidence per class and component,
      as documented at inventory time
    does_not_establish:
    - that a component reported as evidence-absent is genuinely nonexistent rather than merely not produced
    alternative_propositions:
    - absence may reflect not_configured, expired, not_retained, inaccessible, not_produced, not_searched,
      or confirmed_nonexistent — these are distinct states, not synonyms
    corroboration_requirements:
    - custodian representations documented verbatim so later contradictions are provable
    quality_controls:
    - timestamp the inventory
    - initiate authorized preservation immediately through the engagement's legal/organizational process
    stop_conditions:
    - do not report provider non-production of evidence as confirmed nonexistence
  references:
  - text: 'Kent, Chevalier, Grance, Dang (2006) — NIST SP 800-86: Guide to Integrating Forensic Techniques
      into Incident Response. Classical ancestry for source-identification within the Collection phase;
      the relevant sections are §3.1 (Data Collection) and §3.1.1 (Identifying Possible Sources of Data).'
    status: active
  - text: 'Brezinski, Killalea (2002) — RFC 3227 (BCP 55): Guidelines for Evidence Collection and Archiving.
      Section 2.1 states the order-of-volatility principle verbatim: "When collecting evidence you should
      proceed from the volatile to the less volatile, [e.g.] registers, cache; routing table, arp cache,
      process table, kernel statistics, memory; temporary file systems; disk; remote logging and monitoring
      data...; physical configuration, network topology; archival media." Normative anchor for T0104.001''s
      volatility ordering.'
    status: active
  - text: 'International Organization for Standardization & IEC (2012) — ISO/IEC 27037:2012: Information
      technology — Security techniques — Guidelines for identification, collection, acquisition and preservation
      of digital evidence. Defines "identification" as the process of searching for, recognizing, and
      documenting potential digital evidence, and covers collection, acquisition, and preservation of
      that evidence.'
    status: active
  - text: 'European Parliament & Council of the European Union (2024) — Regulation (EU) 2024/1689 (Artificial
      Intelligence Act), Articles 12 and 19. Article 12 requires high-risk AI systems to automatically
      log events across their lifespan (timing of use, database checked, data matched, verifying person)
      for traceability, accountability, and safety. Article 19 requires providers to retain those automatically
      generated logs for at least 6 months (longer where required by EU/national law, or under financial-services
      recordkeeping law for financial-institution providers). Regulatory hook making documented evidence
      absence reportable.'
    status: active
