- id: T0402
  name: Model Identity & Provenance Verification
  phase: P04
  sub_of: null
  evidence_classes:
  - EC01
  - EC02
  - EC05
  access_capability:
  - W
  - G
  - B
  maturity:
    base: Demonstrated
    qualification: per sub-technique; .001 Established mechanics. Method families have different evidence
      bases and none has forensic validation.
  readiness_measures:
  - id: R0005
    relationship: enabling
  - id: R0011
    relationship: strengthening
  - id: R0002
    relationship: strengthening
  notes: 'Separates propositions: exact artifact identity/integrity . deployment identity . lineage/derivation
    . behavior source attribution . ownership-signal verification. Cryptographic identity/attestation
    is the first sub-technique.'
  status: active
  description: 'Model Identity & Provenance Verification addresses several distinct forensic propositions
    that must not be collapsed into one "identity" question, because they require different evidence
    and have different error structures — exact artifact identity/integrity (an equality/cryptographic-verification
    question: digests, signatures, manifests, attestations, not a similarity judgment), deployment identity
    (whether the signed/approved artifact was actually loaded and executed), lineage/derivation (whether
    a model is derived from a claimed ancestor, inferred from parameter, representation, or watermark
    evidence), behavior source attribution (whether a particular model/system produced an observed output
    — inferential, interface-compatible, and weakest), and ownership-signal verification (whether a pre-registered
    watermark or fingerprint verifies under a stated scheme). Exact identity is often stronger and simpler
    than any heuristic similarity where organizations sign and attest their model packages: where model
    signing, attestation, and AI BOMs exist, the cryptographic sub-technique answers the identity question
    by verification rather than by comparing statistical invariants, so FIRAI orders the sub-techniques
    to consider the cryptographic path first and reach the inferential paths — parameter, representation,
    behavioral — only when it is unavailable. An examiner reaches for this technique in provenance disputes,
    deployment-integrity questions, and as a prerequisite step for other Analysis techniques whose interpretation
    depends on knowing the identity of the artifact under analysis. The output is always a proposition-specific
    finding with stated evidence and limits, never a bare assertion of "same model."'
  claim_profile:
    does_establish:
    - 'cryptographic (.001): exact match to a registered package, and with attestation, that it was
      the loaded artifact'
    - 'parameter/representation (.002/.003): derivation inferences supported by stated similarity evidence'
    - 'behavioral (.004): consistency with shared ancestry'
    - 'watermark (.005): verification under the scheme''s stated soundness'
    does_not_establish:
    - 'cryptographic (.001): derivation of an unsigned model, or anything about behavior'
    - 'parameter/representation (.002/.003): unique derivation, especially under laundering'
    - 'behavioral (.004): does not distinguish shared ancestry from shared training data or common-source
      distillation'
    - 'watermark (.005): verification does not extend beyond the transformations the scheme is proven
      to survive'
    alternative_propositions:
    - behavioral similarity may reflect shared training data or common-source distillation rather than
      derivation
    - parameter/representation similarity may reflect convergent training rather than derivation
    corroboration_requirements:
    - corroboration across method families, or with T0303 differential-analysis deltas and R0011 manifests,
      before offering a derivation opinion
    quality_controls:
    - prefer the cryptographic path (.001) where signing/attestation exist
    - present any derivation or source opinion as expert similarity analysis with disclosed limitations
    stop_conditions:
    - never present a derivation/source opinion as identification to the exclusion of all other models
  references:
  - text: CoSAI Open Model Signing
    status: active
  - text: SLSA provenance (supply-chain attestation)
    status: active
  - text: SPDX AI BOM guidance
    status: active
  - text: 'Zeng, Wang, Hu, Xu, Zhou, Wang, Yu, Lin (2024) — HuRef: HUman-REadable fingerprint for large
      language models'
    status: active
  - text: 'Zhang, Liu, Qian, Zhang, Liu, Qiao, Shao (2025) — REEF: Representation encoding fingerprints
      for large language models'
    status: active
  - text: Uchida, Nagai, Sakazawa, Satoh (2017) — Embedding watermarks into deep neural networks
    status: active
  - text: 'Aiken, Kim, Woo, Ryoo (2021) — Neural network laundering: Removing black-box backdoor watermarks
      from deep neural networks'
    status: active
  - text: ISO/IEC 27037 — integrity discipline
    status: active
