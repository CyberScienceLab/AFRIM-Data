- id: T0403
  name: Training Data Membership & Provenance Testing
  phase: P04
  sub_of: null
  evidence_classes:
  - EC05
  - EC06
  access_capability:
  - W
  - G
  maturity:
    base: Demonstrated
    qualification: per sub-technique (ACTION 1 review) — instance-level is Proposed, dataset-level is
      Demonstrated only under stated control conditions. See profile.
  readiness_measures: []
  notes: 'Split (ACTION 1 review): instance-level and dataset-level membership inference have different
    reliability and must be graded separately, not as one "membership inference" card.'
  status: active
  description: 'Training Data Membership & Provenance Testing asks whether specific content was part
    of a model''s training data. The literature draws a sharp reliability line the card must reflect:
    instance-level membership inference — deciding whether one specific record was a training member
    — performs close to random for most domains and is unstable at low false-positive-rate operating
    points, and much of the published success is attributable to distribution shift between member and
    non-member sets rather than genuine memorization, since blind baselines that never query the model
    can outperform published attacks. Dataset-level inference — aggregating many weak per-record signals
    across a candidate dataset — is substantially more reliable, but only where the private validation
    set is IID with the candidate data, was withheld from training, remains undisclosed, and the examiner
    has access to model loss values; aggregation only helps when some underlying membership signal exists
    and enough text is available. No reviewed study establishes that white-box access improves reliability
    over grey-box (loss/probability) access. FIRAI therefore grades instance-level and dataset-level inference
    separately rather than as one technique.'
  claim_profile:
    does_establish:
    - 'instance-level (.001), under stated conditions: weak evidence that a specific record may have
      appeared in training — low strength, must not be overstated'
    - 'dataset-level (.002), under IID private-validation-set conditions with loss access: that a candidate
      dataset, or a sufficiently large collection of its documents, was very likely part of training'
    does_not_establish:
    - 'instance-level (.001): that a specific record was in the training set — most published attacks
      are close to random and unreliable at low false-positive rates'
    - 'dataset-level (.002): membership for opaque production models where training data, distribution,
      and loss access are unknown or unverifiable'
    alternative_propositions:
    - apparent MI success may reflect distribution shift, temporal shift, or dataset-replication bias
      between member and non-member sets rather than genuine memorization
    - a blind baseline that never queries the model can outperform published MI attacks — a positive
      result must be checked against a blind baseline before being reported as attack-derived signal
    corroboration_requirements:
    - run and report a blind baseline alongside any membership-inference result
    - report performance at low false-positive-rate operating points, not only AUC
    - state whether member/non-member sets are IID and how temporal/distribution shift was controlled
    quality_controls:
    - prefer dataset-level (aggregated) inference over a single-record decision wherever the investigative
      question allows it
    - disclose the number of documents aggregated and the underlying per-record signal strength
    stop_conditions:
    - do not report an individual membership-inference decision as a forensic finding absent stated control
      conditions and a blind-baseline comparison
    - do not claim white-box access improves reliability — no reviewed study establishes this
  references:
  - text: Duan, Suri, Mireshghallah, Min, Shi, Zettlemoyer, Tsvetkov, Choi, Evans, Hajishirzi (2024) —
      Do Membership Inference Attacks Work on Large Language Models?
    status: active
  - text: Das, Zhang, Tramèr (2024) — Blind Baselines Beat Membership Inference Attacks for Foundation
      Models
    status: active
  - text: Zhang, Das, Kamath, Tramèr (2024) — Position — Membership Inference Attacks Cannot Prove that
      a Model Was Trained On Your Data
    status: active
  - text: Maini et al. (2024) — LLM Dataset Inference — Did you train on my dataset?
    status: active
  - text: Puerto et al. (2025) — Scaling Up Membership Inference — When and How Attacks Succeed on Large
      Language Models
    status: active
  - text: Hayes et al. (2025) — Exploring the limits of strong membership inference attacks on large
      language models
    status: active
