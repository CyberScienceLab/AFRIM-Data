- id: T0501
  name: Structured Claim Formulation
  phase: P05
  sub_of: null
  evidence_classes:
  - P05
  access_capability:
  - W
  - G
  - B
  maturity:
    base: Proposed
    qualification: null
  readiness_measures: []
  notes: |-
    For each finding, the profile covers:

    Proposition
    Output type (observation / comparison / statistical inference / causal inference / source-identity inference / legal-regulatory conclusion)
    Source authenticity & integrity
    Access/coverage limitations
    Method-validation scope
    Tool/version/environment verification
    Repeatability/reproducibility
    Performance, error & uncertainty
    Corroborating & conflicting evidence
    Alternative propositions
    Case-specific limitations & stop conditions

    Any short claim label derives from this profile, never from access alone.
  status: active
