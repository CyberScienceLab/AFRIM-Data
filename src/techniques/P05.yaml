  readiness_measures: []
  notes: 'For each finding: proposition, output type (observation / comparison / statistical inference
    / causal inference / source-identity inference / legal-regulatory conclusion), source authenticity
    & integrity, access/coverage limitations, method-validation scope, tool/version/environment verification,
    repeatability/reproducibility, performance-error-uncertainty, corroborating & conflicting evidence,
    alternative propositions, case-specific limitations & stop conditions. Any short claim label derives
    from this profile, never from access alone.'
