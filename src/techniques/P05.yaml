    base: Demonstrated
    qualification: null
  readiness_measures: []
  notes: |-
    Maps findings to target-forum standards as versioned jurisdiction overlays, each carrying:

    Forum
    Instrument
    Provision
    Status/effective date
    Applicability conditions
    Mapping type
    Last verified
    Source

    Seed overlays:

    US Daubert/FRE 702
    Proposed FRE 707 (as of the U.S. Courts Advisory Committee's May 2026 report, not yet ripe for amendment, revised version expected Fall 2026)
    Frye
    Canadian Mohan/White Burgess

    FIRAI records the mapping without predicting admissibility.
  status: active
  references:
  - text: Advisory Committee on Evidence Rules (2026) — Report of the Advisory Committee on Evidence Rules.
      United States Courts
