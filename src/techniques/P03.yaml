- id: T0303
  name: Weight & Checkpoint Differential Analysis
  phase: P03
  sub_of: null
  evidence_classes:
  - EC05
  access_capability:
  - W
  maturity:
    base: Demonstrated
    qualification: forensic-incident framing is FIRAI’s extension over demonstrated adjacent-domain mechanics
  readiness_measures:
  - id: R0002
    relationship: required
  - id: R0011
    relationship: strengthening
  - id: R0005
    relationship: strengthening
  notes: Diff questioned artifact vs authenticated known-good reference to localize parameter changes.
    Four result levels (byte-identical / exact aligned-tensor / normalized-then-compared / interpretation),
    each supporting different claim strength. Feeds T0406.
  status: active
  description: Weight & Checkpoint Differential Analysis compares a questioned model artifact against
    an authenticated known-good reference to determine whether parameters differ, and if so where and
    by how much — the AI analogue of binary differential analysis in classical software forensics. The
    output is a delta map. As an Examination-phase technique its job ends at producing an accurate, repeatable
    account of what differs; interpreting why the parameters differ is Analysis-phase work (T0406). Results
    occur at four distinct levels — byte-identical artifact, exact aligned-tensor comparison, normalized-then-compared,
    and interpretation of a delta's origin — which must not be conflated, since they rest on different
    assumptions and support different claims.
  claim_profile:
    does_establish:
    - That the compared, successfully aligned tensors are identical or differ
    - Where they differ and by what magnitude/distribution
    does_not_establish:
    - That the right artifacts were compared
    - That every deployed component was covered
    - That alignment/normalization was correct
    - That the reference is authentic and approved
    - What a delta means
    alternative_propositions:
    - A localized delta is consistent with both unauthorized modification and legitimate fine-tuning,
      patching, or optimization
    - A no-difference result is consistent with an unmodified model and with modification confined to
      components outside the compared package
    corroboration_requirements:
    - Change-management records
    - R0011 deployment manifests
    - T0406 assessment
    quality_controls:
    - Authenticate and verify integrity of both artifacts before comparison
    - Document every normalization step and the comparison-tool version
    stop_conditions:
    - Stop and report non-comparability where architectures do not align
    - Do not extend a package-level no-change result to the deployed system
  references:
  - text: Shang, Li, Chen, Liu, Gu, Wang (2026) — Attesting model lineage by consisted knowledge evolution
      with fine-tuning trajectory. USENIX Security '26
    status: active
  - text: Ilharco, Ribeiro, Wortsman, Gururangan, Schmidt, Hajishirzi, Farhadi (2023) — Editing models
      with task arithmetic. ICLR 2023
    status: active
  - text: 'He, Shen, Xia, Hua, Tong, Zhong (2024) — SGBA: A stealthy scapegoat backdoor attack against
      deep neural networks. Computers & Security, 136'
    status: active
  - text: 'Lyle, Guttman, Butler, Sauerwein, Reed, Lloyd (2022) — NIST IR 8354: Digital Investigation Techniques
      — A NIST Scientific Foundation Review'
    status: active
  - text: ISO/IEC 27037 — hash verification and integrity discipline
    status: active
