  name: Model Signing, Attestation & Provenance Registration
  description: Signed model/package manifest, trusted identity, key governance, transparency/registry
    record, deployment attestation; watermark/fingerprint registration is an optional child measure, not
    the default control.
- id: R0006
  name: Agent Action & Tool-Call Telemetry
  type: strengthen
- id: R0007
