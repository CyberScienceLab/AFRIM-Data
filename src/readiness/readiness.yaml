- id: R0009
  name: AI System, Component & Custodian Register
  description: Component identity, owner/custodian, provider, model/package ID, deployment location, data
    stores, tools/endpoints, logging locations, retention, export route, escalation contact. Strengthens
    T0102/T0103/T0104.
- id: R0010
  name: Supplier Forensic Preservation, Export & Change-Notice Clauses
  description: Preservation capability, export format, timestamps/time source, integrity metadata, retention,
    model/config change notices, support for legal requests, evidence-delivery responsibility. Addresses
    G0005 partial.
- id: R0011
  name: Reproducible AI Deployment Manifest / AI BOM
  description: Model+adapter digests/signatures, tokenizer, container/image, code revision, dependencies,
    runtime/hardware where material, prompt/config version, retrieval snapshot, embedding model, tool
    schemas, attestation chain. A checkpoint alone is not the deployed system.
